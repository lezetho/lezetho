name: GitHub Metrics
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          config_output: json
          config_base64: no
          filename: github-metrics.json
          output_action: none

      - name: rebuild json
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          gh api --paginate user/orgs --jq '[.[] | {login, url: ("https://github.com/" + .login)}]' \
            | jq -s 'add // []' > /tmp/orgs.json

          jq --slurpfile orgs /tmp/orgs.json '{
            commits: .computed.commits,
            repositories: {
              owned: .user.repositories.totalCount,
              contributed_to: .user.repositoriesContributedTo.totalCount
            },
            organizations: {
              count: ($orgs[0] | length),
              list: $orgs[0]
            },
            generated: .meta.generated
          }' /metrics_renders/github-metrics.json > /tmp/trimmed.json

      - name: upd json
        run: |
          git pull --rebase --autostash
          cp /tmp/trimmed.json github-metrics.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.json
          git diff --staged --quiet || git commit -m "Update github-metrics.json"
          git push
